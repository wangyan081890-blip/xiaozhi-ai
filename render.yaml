# Render Blueprint：连接本仓库后，自动创建 Web 服务（Docker）+ PostgreSQL。
# 使用方式见 RENDER.md「方式 A」。
services:
  - type: web
    name: xiaozhi-ai
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xiaozhi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEFAULT_PROVIDER
        value: deepseek
      - key: COOKIE_SECURE
        value: "true"
      - key: OLLAMA_ENABLED
        value: "false"
      - key: MAX_CONCURRENT
        value: "2"

databases:
  - name: xiaozhi-db
    plan: free
    databaseName: xiaozhi
    user: xiaozhi
    region: singapore
