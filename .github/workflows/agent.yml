name: AI Dev Agent

on:
  workflow_dispatch:
    inputs:
      task_id:
        required: true
      requirement_b64:
        required: true
      branch:
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-dev-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run AI development agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          DEV_CALLBACK_SECRET: ${{ secrets.DEV_CALLBACK_SECRET }}
          AGENT_MAX_STEPS: "18"
          REQUIREMENT_B64: ${{ inputs.requirement_b64 }}
        run: |
          python scripts/dev_agent.py \
            --task-id "${{ inputs.task_id }}" \
            --branch "${{ inputs.branch }}"
